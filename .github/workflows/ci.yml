# Nom du workflow
name: CI

# Déclencheurs du workflow
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Définition des jobs
jobs:

  # Compilation
  build:

    # Spécifie l'environnement d'exécution (runner)
    runs-on: ubuntu-latest

    # Définition des étapes du job
    steps:

    # Récupération du code source du dépôt
    - uses: actions/checkout@v4
  
    # Installation du SDK .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 7.0.x
    
    # Restauration des dépendances
    - name: Restore dependencies
      run: dotnet restore

    # Compilation du projet (sans restauration car déjà faite)
    - name: Build
      run: dotnet build --no-restore

  # Tests
  test:

    # Spécifie l'environnement d'exécution (runner)
    runs-on: ubuntu-latest

    # Précision de la dépendance entre les jobs (le job "test" dépend du job "build")
    needs: build

    # Définition des étapes du job
    steps:

    # Récupération du code source du dépôt
    - uses: actions/checkout@v4
  
    # Installation du SDK .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 7.0.x
    
    # Exécution des tests unitaires (avec un affichage standard)
    - name: Test
      run: dotnet test --verbosity normal

  # Build des artefacts
  artefact:

    # Spécifie l'environnement d'exécution (runner)
    runs-on: ubuntu-latest

    # Précision de la dépendance entre les jobs (le job "artefact" dépend des jobs "build" et "test")
    needs: [build, test]

    # Définition des étapes du job
    steps:

    # Récupération du code source du dépôt
    - uses: actions/checkout@v4
  
    # Installation du SDK .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 7.0.x
    
    # Publication du projet (création des artefacts)
    - name: Publish
      run: dotnet publish --configuration Release --output ./publish

    # Création d'un fichier zip contenant les artefacts publiés'
    - name: Create zip
      run: zip -r TourGuide.zip ./publish

    # Upload des artefacts pour les rendre disponibles après l'exécution du workflow
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TourGuide
        path: TourGuide.zip
