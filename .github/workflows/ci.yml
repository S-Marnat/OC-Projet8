# Nom du workflow
name: CI

# Déclencheurs du workflow
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Définition des jobs
jobs:
  build:

    # Spécifie l'environnement d'exécution (runner)
    runs-on: ubuntu-latest

    # Définition des étapes du job
    steps:

    # Récupération du code source du dépôt
    - uses: actions/checkout@v4
  
    # Installation du SDK .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 7.0.x
    
    # Restauration des dépendances
    - name: Restore dependencies
      run: dotnet restore

    # Compilation du projet (sans restauration car déjà faite)
    - name: Build
      run: dotnet build --no-restore

    # Exécution des tests unitaires (sans compilation car déjà faite et avec un affichage standard)
    - name: Test
      run: dotnet test --no-build --verbosity normal
